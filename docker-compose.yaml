services:
  iptimprove:
    build:
      context: .
      args:
        BMS_ALLOWED_ORIGINS: "${BMS_ALLOWED_ORIGINS:-https://hosxp.net https://had-api.moph.go.th}"
    container_name: iptimprove-workbench
    ports:
      - "3081:8080"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
